# Self-specified, NOT workspace-inherited: itok must carry its own package
# metadata and lints so `git subtree split -P crates/itok` yields a
# complete crate (V13, V27). The duplication with the workspace deny-list
# is the price of detachability (V492) -- cargo lints cannot cascade the
# way file-config baselines do.
[package]
name = "itok"
# The ladder (V70): each minor is a level of GUARANTEE, not a feature count.
# 0.3.0 is an ODD minor, which the ladder reserves for a fix release between
# milestones -- and that is exactly what this is: TLS on the exact tier, an
# MSRV matched to the toolchain, the public docs, and the gate steps added
# with them. No milestone moved.
#
# It is also the FIRST PUBLIC release, which used to be welded to 0.7.0.
# V107 separated those: publication is a distribution decision, maturity is a
# rung, and they move independently. So this ships at the rung that is TRUE
# -- 0.4's telemetry is still open, and the number says so out loud.
#
# THE PRE-RELEASE DID ITS JOB, so the suffix goes.
#
# `0.3.0-rc.1` existed because crates.io is immutable: prove the pipeline
# before spending a permanent number. It proved it by FAILING in five places
# no dry run reached -- B17 (fifteen tests failed on the published .crate,
# because `--verify` only compiles it), B18 (`show <merge>` reported zero),
# B19 (`-C` is not isolation, so every verb could answer about the wrong
# repo), B20 (a coverage badge no machine could reproduce) and B21 (the gate
# hanging instead of reporting). Two of those would have been permanent in a
# non-pre-release version.
#
# Each has a runner now, and the release itself is `cargo-release` driven by
# `release.toml` rather than eight remembered commands. That is what makes
# this number safe to spend.
version = "0.3.0"
edition = "2021"
# MSRV, matched to `microlith` and to the toolchain this gate actually runs
# (`flake.lock` pins rustc 1.95.0). Both halves of that matter.
#
# 1.96 -> 1.95 with the move to the fleet's nixos 26.05 lock, which carries
# 1.95.0. LOWERING an MSRV widens the set of consumers who can build this,
# so it is compatible in the direction that matters and needs no version
# bump of its own. The rule is unchanged and is what moved the number: the
# declared minimum is the toolchain the gate runs, because that is the only
# one anything here is ever compiled against.
#
# It was `1.82`, derived from the oldest release carrying a feature the code
# uses (`Option::is_none_or`). That is a defensible way to pick a number and
# a poor way to KEEP one: nothing here ever compiled against 1.82. A
# consumer on 1.82 would have been the one to find out, and pre-publication
# was the moment that cost nothing to fix.
#
# There is deliberately no MSRV axis in CI. T60 considered one and rejected
# it: such a job can only FAIL when the declared minimum sits below the
# toolchain CI runs, and this line keeps the two equal, so the axis would
# recompile the same toolchain for the same answer (V10's vacuous pass). It
# becomes worth adding the day this number drops below the flake pin.
#
# Set to the pinned toolchain instead, so the claim is EVIDENCED by every
# gate run rather than asserted beside them. Matching microlith keeps one
# number across both repos, which is also why the dev shells agree.
#
# Direction matters now that `0.3.0-rc.1` IS published. LOWERING is safe --
# it widens who can build. RAISING would strand consumers, and is a decision
# to make against the ladder (V70) rather than a side effect of a nixpkgs
# bump. If a future fleet lock carries a NEWER rustc, this number should not
# follow it upward without that decision being made deliberately.
rust-version = "1.95"
license = "MIT"
description = "context-cost estimator: token and window budgets for files and changes"
repository = "https://github.com/pr0d1r2/itok"
homepage = "https://github.com/pr0d1r2/itok"
documentation = "https://docs.rs/itok"
readme = "README.md"
keywords = ["tokens", "llm", "context", "tokenizer", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Dev-only guard files, meaningless to a crate consumer (V26/V13).
exclude = [
  "flake.nix",
  "hk.pkl",
  "pkl",
  "flake.lock",
  ".envrc",
  "coverage-baseline.json",
  "lexicon.txt",
  ".context-limits",
  # The coverage cache and the badge generator that reads it. Both are gate
  # machinery for THIS repo -- a consumer has no README of ours to render.
  ".coverage",
  "scripts",
  # The config that PUBLISHES this crate is about the release rather than
  # part of it. A consumer has nothing to release.
  "release.toml",
  # Its whole subject is `hk.pkl`, which the line above excludes. Shipping
  # a test that reads an excluded file is how three assertions failed on
  # the tarball while staying green here -- see the `package` step in
  # hk.pkl. A consumer has no gate for it to be right about.
  "tests/ci.rs",
]

# What the published .crate MUST contain, checked by hk's `package` step.
#
# The file set that ships is DERIVED -- git-tracked, minus `exclude` --
# so it is a second set that nothing here examined. Every path below is
# read by a test that DOES ship, which means dropping one turns green in
# this repo into a failure for a consumer, and crates.io is immutable.
#
# The `.jsonl` fixtures are the sharp case: they are tracked only because
# `.gitignore` negates its own `*.jsonl` rule for this directory. Delete
# that one negation and five fixtures leave the tarball with no other
# signal at all.
#
# Only files something READS, with ONE deliberate exception noted below.
# Padding this with everything that happens to ship would make it a
# wish-list rather than a runner (V17).
#
# PROVEN by planting each class as an `exclude` entry: `LICENSE` and a
# `.jsonl` fixture are both caught by name. `README.md` is NOT -- the
# `readme = "README.md"` field above makes cargo ship it whatever `exclude`
# says. Its entry is kept as a backstop for the day that field changes, but
# it is not what guards the file today, and calling it a live check would
# be the vacuous-pass problem this list exists to avoid.
[package.metadata.itok]
must-package = [
  # src/docs.rs freezes the generated command block against it
  "README.md",
  # read by cli, hygiene, concurrency and spec_compact
  "SPEC.md",
  # the `license = "MIT"` field is a claim ABOUT this file
  "LICENSE",
  # THE EXCEPTION: nothing reads this, and it is here anyway. A licence
  # notice that fails to ship fails its entire purpose, and it fails
  # invisibly -- exactly like the test-file case, but with legal weight
  # instead of a red suite. Different grounds, same blind spot.
  "docs/THIRD-PARTY-NOTICES.md",
  # tests/cli.rs replays the recorded ollama interaction
  "tests/fixtures/ollama.json",
  # session_read + session_fixtures; tracked only via .gitignore's negation
  "tests/fixtures/session/minimal.jsonl",
  "tests/fixtures/session/tool-shapes.jsonl",
  "tests/fixtures/session/torn-tail.jsonl",
  "tests/fixtures/session/truncated.jsonl",
  "tests/fixtures/session/weird.jsonl",
]

[[bin]]
name = "itok"
path = "src/main.rs"

# The dummy tier is zero-dep (V4). --bpe is a real tokenizer and needs
# one: tiktoken-rs embeds the o200k ranks, so it is offline at runtime
# and deterministic (V12/V5). It is optional and behind the `bpe` feature
# so `--no-default-features` yields the tiny dummy-only tool (V13/V23);
# default-on because real counts are the point of installing.
[features]
default = ["bpe", "session"]
bpe = ["dep:tiktoken-rs"]
# The runtime axis (V41) parses the harness's own transcript: a FOREIGN,
# unversioned JSONL schema where a hand-rolled extractor is exactly the
# wrong risk (V43 wants defensive parsing). serde_json is pure-Rust and
# networkless, but V4 claims the dummy tier is ZERO-dep, so it is
# feature-gated like every other tier (V23's shape). Default-on, because
# the runtime verbs are the point of installing at 0.4; and
# `--no-default-features` stays genuinely zero-dep, which the gate proves.
session = ["dep:serde_json"]
# The exact tier (V4) is a LAN-local backend: ollama's own tokenizer over
# plain HTTP on :11434 -- keyless, free, on-LAN (V22). Behind its own
# feature (V23) so the core ships ZERO network deps and runs in a
# networkless sandbox (V34). ureq takes `rustls` and nothing else, so
# `--ollama=https://host` works. It has to: the exact tier sends FILE CONTENT
# to the endpoint, and over http:// that is cleartext.
#
# Going 2 -> 3 to GAIN tls made this tier SMALLER -- 60 packages to 44, and
# the 19 Unicode-3.0 licences went to zero -- because ureq 2 dragged in
# url -> idna -> the whole ICU stack. The intuition runs the other way, which
# is why it is written down.
ollama = ["dep:ureq"]

[dependencies]
tiktoken-rs = { version = "0.6", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }
serde_json = { version = "1", optional = true }

# assert_cmd/predicates are dev-only and already in the workspace lockfile.
[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
serde_json = "1.0.151"
vcr-cassette = "2.0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
arithmetic_side_effects = "deny"
too_many_lines = "deny"
cognitive_complexity = "deny"
excessive_nesting = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"

[lints.rust]
unsafe_code = "forbid"
