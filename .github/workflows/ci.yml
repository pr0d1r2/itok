name: ci

# The public, cargo-native gate (V31/V39): the same verdict as the monorepo,
# reproduced on plain rustup -- no nix, no uow, no host guard bins. Dormant
# in the monorepo (GitHub reads only root-level workflows); active once
# `git subtree split` reroots this crate to a repo root.
#
# This is now the ONLY gate declaration in the standalone repo -- the unit
# declaration it once mirrored is monorepo-only. Each of its five ops is
# reproduced at or above its old strength: fmt identical; clippy gains
# `--all-features -- -D warnings`; its lib/e2e nextest split becomes plain
# `cargo test` (both kinds) plus the ollama axis; coverage keeps the
# corrected 98 floor (a stale 99 there was the workspace aggregate, B4).
# NOT carried over, on purpose: `--test-threads=1` (the tests are hermetic
# -- temp dirs keyed by test name + pid, per-child `current_dir`, ephemeral
# replay ports -- so serializing only hides real parallelism bugs) and the
# pre-commit/pre-push phase split (consumed by a hook runner that does not
# exist here; a git hook or justfile is the standalone form).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- the diff/show/log tests read HEAD~n; a shallow
      # clone has no history and would fail them (V37/B3 class).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test
      # The ollama network backend is cassette-replayed offline (V38); this
      # axis keeps that path from rotting. The live smoke is #[ignore].
      - run: cargo test --features ollama

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # --features ollama so the network path (covered by the cassette) is
      # instrumented too; the floor matches the monorepo's coverage-freeze.
      - run: cargo llvm-cov --features ollama --fail-under-lines 98
