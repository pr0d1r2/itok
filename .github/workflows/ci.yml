name: ci

# The gate, run exactly the way it runs locally: `nix develop` supplies
# the toolchain pinned in flake.lock, and `hk check` runs the ops defined
# in hk.pkl. One definition (V64), one toolchain, no second install path,
# and no version skew between a runner and a laptop.
#
# hk stays a LOCAL tool: CI reaches it *through* the dev shell rather than
# installing it, so it is never a dependency of the crate. The same goes
# for every linter -- typos, actionlint, taplo, shellcheck and nixfmt all
# arrive from the same pinned shell, which is why this file installs none
# of them.
#
# This supersedes the bare-rustup workflow (V31, amended by V75). That
# design predated the crate carrying its own root flake; now that it does,
# nix is this crate's own toolchain rather than a host dependency.
#
# PENDING -- listed rather than silently absent, because none of it can be
# validated until the repo is public:
#   * platform matrix (macos-arm beside ubuntu)      T60 / 0.8.0
#   * MSRV 1.82 axis                                 T60 / 0.8.0
#   * build caching (nix store + cargo target)       T60 / 0.8.0
#   * actions pinned to SHAs rather than tags        T60 / 0.8.0
#   * release automation and publish                 T59 / 0.7.0

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 -- the diff/show/log tests read HEAD~n; a shallow
      # clone has no history and would fail them (V37/B3 class).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      # --check, because `hk check` defaults to running FIX commands; CI
      # must report, never rewrite. --all, because CI has no staged set.
      #
      # --no-fail-fast inverts the local default on purpose. Locally the
      # loop is cheap, so the FIRST failure is the most useful thing to
      # surface. Here a round-trip costs minutes, so a complete list beats
      # an early one -- whoever, or whatever, fixes this should get every
      # problem in one pass.
      - run: nix develop --command hk check --all --check --no-fail-fast

      # All three feature configurations must build reproducibly. The
      # minimal one is load-bearing: it is what proves the
      # zero-dependency core actually builds (V23/V13).
      - run: nix build .#default
      - run: nix build .#itok-minimal
      - run: nix build .#itok-ollama
