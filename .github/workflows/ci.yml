name: ci

# The gate, run exactly the way it runs locally: `nix develop` supplies
# the toolchain pinned in flake.lock, and `hk check` runs the ops defined
# in hk.pkl. One definition (V64), one toolchain, no second install path,
# and no version skew between a runner and a laptop.
#
# hk stays a LOCAL tool: CI reaches it *through* the dev shell rather than
# installing it, so it is never a dependency of the crate. The same goes
# for every linter -- typos, actionlint, taplo, shellcheck and nixfmt all
# arrive from the same pinned shell, which is why this file installs none
# of them.
#
# This supersedes the bare-rustup workflow (V31, amended by V75). That
# design predated the crate carrying its own root flake; now that it does,
# nix is this crate's own toolchain rather than a host dependency.
#
# PENDING -- listed rather than silently absent:
#   * cargo target caching, measured                    T60 / 0.8.0
#   * release automation and publish                    T59 / 0.7.0
#
# NO MSRV AXIS, and that is a decision rather than an omission. An MSRV job
# is worth having when the declared minimum is BELOW the toolchain CI runs,
# because only then can it fail while the normal build passes. Here they are
# the same number: `rust-version = "1.95"` in Cargo.toml, and flake.lock
# pins rustc 1.95.0, which every job below already uses. An axis would
# recompile the identical toolchain and report the identical answer -- a
# green check that cannot fail is the vacuous pass V10 warns about. It
# becomes real the day the declared minimum drops below the pin.

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the gate without inventing a commit. Propagated from microlith,
  # where it exists for the same reason (V84).
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless.
# Without this they both run to completion and compete for the same cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token this workflow gets is the one it can leak. Nothing here writes
# to the repository -- no tag, no comment, no commit -- so read is the whole
# requirement, and stating it means a future step that needs more has to ask
# for it in the diff rather than inherit it from a repository setting nobody
# reads. `zizmor` gates this: without the block it reports the default scope,
# whatever that default happens to be today.
permissions:
  contents: read

jobs:
  # The gate. Everything hk defines, in hk's own order, on every system the
  # flake declares.
  #
  # One runner per `systems` entry in flake.nix, so the platform claim is
  # GATED rather than asserted:
  #
  #   ubuntu-latest     x86_64-linux
  #   ubuntu-24.04-arm  aarch64-linux
  #   macos-latest      aarch64-darwin
  #
  # A matrix REPLICATES the work, it does not divide it: each runner pays
  # the whole gate. Wall clock stays roughly flat because they run
  # concurrently; total compute triples. What it buys is the difference
  # between "the suite passes" and "the suite passes where users are", and
  # this repo has already shipped two defects that were invisible from one
  # vantage point (B18's merge commit, B20's platform-dependent coverage).
  gate:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every platform reports. Cancelling the others would hide whether a
      # failure is platform-specific or universal -- which is the first
      # question anyone asks, and the one a matrix exists to answer.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    # A bound, not hygiene, and it EARNED ITS KEEP within an hour of being
    # added. GitHub serves no logs for an in-progress job and defaults to
    # 360 minutes, so an unbounded hang is six hours of silence followed by
    # nothing to read. This bound fired at 45m16s and produced the log that
    # identified the hk deadlock -- a diagnosis no amount of staring at the
    # Actions page could reach, because the page had nothing to show.
    #
    # 10, which is ~2x the worst MEASURED job. Three numbers, each replacing
    # a guess with a measurement, and the middle one is the lesson:
    #
    #   45  chosen when nothing had been timed
    #   15  worst job 6m40s, so ~2.2x  -- correct until the shell changed
    #   25  provisional: `cargo-release` and hk-from-`nix-hk` added two Rust
    #       builds, macOS shell materialisation went seconds -> ~8 min, and
    #       the job died at 15m05s SECONDS after its last step had passed
    #   10  the binary cache above removed those 8 minutes; worst is now
    #       `gate (macos-latest)` at 4m43s, with 4m32s and 2m54s beside it
    #
    # 25 was deliberately loose pending a green run, and this is that run, so
    # it gets tightened rather than left. A bound nobody revisits drifts back
    # toward the 360-minute default that hid B21 for three hours -- and a
    # bound is only worth having if it is tight enough to fire before a hang
    # costs an afternoon.
    #
    # The 10 now sits ON THE GATE STEP, which is what it bounds: the hk
    # deadlock was a step. At job level it also counted the cache upload,
    # and on itok#52 it cancelled a PASSED gate while the new store was
    # being compressed. Each cache step carries its own small bound and may
    # fail; this job bound is only the net above their sum.
    timeout-minutes: 30
    steps:
      # Pinned to commit SHAs, not tags. A tag is mutable: whoever controls
      # the action can move `v4` to different code, and every workflow that
      # trusts the tag runs it on the next push. The tag stays in the
      # comment because a SHA alone tells a reader nothing about which
      # version they are on, or whether it is behind. Same choice as
      # microlith, and the same two SHAs where the action is shared (V84).
      #
      # fetch-depth: 0 -- the diff/show/log tests read HEAD~n; a shallow
      # clone has no history and would fail them (V37/B3 class). This is
      # the one place itok's workflow must differ from microlith's, whose
      # tests read no history at all.
      # persist-credentials: false -- checkout writes the job token into
      # `.git/config` as an extraheader by default, where every later step
      # can read it. Nothing here pushes, so the token is only a liability
      # after the clone. The history the dogfood tests read is already on
      # disk and needs no credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The fleet's binary cache. `nix-hk` and `microlith` are Rust crates
      # built from source without it, and the dev shell gained BOTH plus
      # `cargo-release` -- MEASURED on macOS, materialising the shell went
      # from seconds to ~8 minutes and took the job past its bound. The cache
      # already holds these; CI simply was not reading it.
      #
      # Declared HERE rather than as `nixConfig` in flake.nix on purpose: a
      # flake-level substituter prompts every contributor to trust it, and a
      # prompt answered by habit is not consent. CI is a machine we control
      # and the key is pinned beside the URL.
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=

      # NO Nix store cache. The shell is substituted from cache.nixos.org and
      # pr0d1r2.cachix.org (above); a cold one materialised in 26s on Linux.
      # MEASURED on #53: restoring the cached store took 141s on macOS, and
      # the four `nix-*` entries (0.8-1.2 GiB each) plus the cargo ones sat
      # at 9.7 of the repo's 10 GB Actions budget, so every new key evicted
      # another. A cache slower than a cold fetch, that also crowds out the
      # cargo cache, is a cost, not an optimisation.

      # Nine compiles of the dependency graph happen per run and cannot
      # share: cargo keys artifacts by feature set, so `--all-features`
      # (clippy), the default set (test), `ollama`, `--no-default-features`
      # and the llvm-cov instrumented build are five distinct trees, with the
      # three sandboxed `nix build`s on top.
      #
      # The count is a structural fact; its COST here is not measured, and
      # the one figure we do have argues for modesty -- clippy, a full
      # dependency download and 160 tests took 53 seconds from cold. Kept
      # because it cannot hurt and the key rotates on `Cargo.lock`, not
      # because a number justifies it. If the caches ever compete for the
      # 10 GB budget, this is the one to drop first.
      #
      # `actions/cache` rather than `Swatinem/rust-cache`: that action keys on
      # `rustc -vV` and rustc only exists INSIDE the dev shell, so it would
      # need the shell's PATH exported into the job first. Keying on
      # `flake.lock` says the same thing -- the toolchain is pinned there --
      # without a second way to name the compiler.
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-

      # --check, because `hk check` defaults to running FIX commands; CI
      # must report, never rewrite. --all, because CI has no staged set.
      #
      # `--no-fail-fast` on PUSH only, and the split is the point.
      #
      # On a PR, fail-fast is a FEATURE rather than a compromise: the merge is
      # blocked by a red check either way, so the only thing that matters is
      # time-to-first-signal, and stopping at the first failure delivers it in
      # about ninety seconds. On a push to main nobody is waiting on the
      # answer, so the complete list is worth the extra minutes.
      #
      # The flag was OFF entirely until now, because hk went silent the
      # instant a `depends`-chained step failed under it -- two reproductions,
      # 74 and 43 minutes of no output, both ended by a kill rather than a
      # verdict (B21). hk 1.55.0 fixes it, VERIFIED on the same minimal
      # fixture that hung 3/3 on 1.51.0: the dependent of a failed step now
      # runs to completion instead of waiting forever. That version arrives
      # with `nix-hk`, so the dependency bump is what made this safe.
      #
      # The timeout on this step stays regardless. It is what made the
      # deadlock visible, and it is what bounds the next one.
      # Same shape as the `nix build` step below: the expression is evaluated
      # into `env:`, and the shell reads a variable. `${FAIL_FAST:+"$FAIL_FAST"}`
      # expands to a single quoted argument when set and to NOTHING when empty,
      # which is what a bare `$FAIL_FAST` would also do here -- but only by
      # relying on word splitting, and a construct that is correct by accident
      # is one a later edit breaks silently.
      - env:
          FAIL_FAST: ${{ github.event_name == 'push' && '--no-fail-fast' || '' }}
        timeout-minutes: 10
        run: nix develop --command hk check --all --check ${FAIL_FAST:+"$FAIL_FAST"}

      # Saved only after a passing gate, only on a key miss, and bounded: a
      # slow upload is skipped and the job stays green. The repo-wide Actions
      # cache budget is 10 GB, and a platform matrix multiplies every entry.
      - if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}

  # All three feature configurations must build reproducibly. The minimal
  # one is load-bearing: it is what proves the zero-dependency core actually
  # builds (V23/V13).
  #
  # A SEPARATE job, and a matrix, because these three shared nothing with
  # the gate except wall-clock. They are sandboxed builds -- no cargo
  # artifact crosses into them -- so running them after the gate only added
  # their cost to its cost.
  #
  # MEASURED once split: 33s, 59s and 68s, concurrent, on a COLD cache --
  # 68 seconds of wall clock for all three. They were never the expensive
  # part, which is worth writing down, because the obvious reading of a
  # 50-minute run is that everything in it is slow.
  #
  # CROSSED with the platform matrix: three packages on three systems is
  # nine jobs, and they are affordable precisely because each is about a
  # minute. The alternative -- build every package on x86 only -- would
  # leave `nix build .#itok-minimal` unproven on the two systems where the
  # zero-dependency claim is most likely to break first, which is the
  # claim's whole point.
  nix-build:
    runs-on: ${{ matrix.os }}
    # 10, matching the gate again. These jobs never enter the dev shell --
    # they build PACKAGES -- so they did not get heavier when it did.
    # MEASURED across all nine: 54s to 3m55s, macOS slowest, so ~2.5x the
    # worst.
    timeout-minutes: 10
    strategy:
      # One package failing is a fact about that package on that system.
      # Cancelling the rest would hide whether the defect is shared.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        package: [default, itok-minimal, itok-ollama]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The fleet's binary cache. `nix-hk` and `microlith` are Rust crates
      # built from source without it, and the dev shell gained BOTH plus
      # `cargo-release` -- MEASURED on macOS, materialising the shell went
      # from seconds to ~8 minutes and took the job past its bound. The cache
      # already holds these; CI simply was not reading it.
      #
      # Declared HERE rather than as `nixConfig` in flake.nix on purpose: a
      # flake-level substituter prompts every contributor to trust it, and a
      # prompt answered by habit is not consent. CI is a machine we control
      # and the key is pinned beside the URL.
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            extra-substituters = https://pr0d1r2.cachix.org
            extra-trusted-public-keys = pr0d1r2.cachix.org-1:NfWjbhgAj41byXhCKiaE+av3Vnphm1fTezHXEGsiQIM=

      # No Nix store cache here either: see the `gate` job. These jobs
      # substitute from the binary caches above and push what they build.

      # PUSH, not merely READ. Every cache line above this one made CI a
      # CONSUMER; nothing made it a PRODUCER -- so `packages.default`
      # EXISTED and nobody could substitute it, and a consumer flake that
      # gates on `itok` still built itok AND tiktoken from source to lint
      # one file. That is the cost T99 names, and it survives the package
      # being defined: defining an output and publishing one are two
      # different jobs, and only the second is what "callable" means.
      #
      # BEFORE the build, not after: cachix-action installs a nix
      # post-build-hook, so it pushes paths realised WHILE IT IS ARMED.
      # Placed after `nix build` it would arm on a store that already has
      # everything and push nothing -- silently, and green.
      #
      # GUARDED on the token by cachix-action itself: with `authToken`
      # empty it configures the substituter and skips the push rather than
      # failing. That is what makes it safe here, because a `pull_request`
      # from a FORK gets no secrets, and a hard-required push would turn
      # every outside contribution red for a reason having nothing to do
      # with the contribution. No token = still built, still gated, just
      # not shared. The cache stays a SPEEDUP and is never a gate: nothing
      # in this file may depend on a push having happened.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: pr0d1r2
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # The matrix value reaches the shell through `env:` rather than being
      # pasted into the script by the expression engine. Both are workflow-
      # authored constants here, so nothing hostile can arrive either way --
      # the point is that the shell receives DATA in a variable rather than
      # having its own source code assembled around it, which is the only
      # form that stays safe when the input later changes.
      - env:
          PACKAGE: ${{ matrix.package }}
        run: nix build ".#$PACKAGE"
