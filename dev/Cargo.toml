[package]
name = "itok-dev"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata.release]
release = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "itok-dev"
path = "src/main.rs"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
too_many_arguments = "allow"

[lints.rust]
unsafe_code = "forbid"
