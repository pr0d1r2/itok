# A dev-time driver for the HOST's spec format checker (T90).
#
# Deliberately its OWN package, outside itok's: itok must not gain a path
# dependency on a host crate, or extraction stops being a move (V13). This
# manifest may dangle after `subtree split` -- the caller treats a build
# failure as "unavailable" and says so (V74).
[package]
name = "specfmt"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cavekit-spec = { path = "../../../unit_of_work/crates/cavekit-spec" }
